<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Scalper — Live Ledger</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #1e1e2e;
    --text: #e0e0e8;
    --dim: #6b6b80;
    --green: #00e676;
    --red: #ff5252;
    --accent: #7c4dff;
    --gold: #ffd740;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  .header h1 span { color: var(--accent); }
  .header .sub {
    color: var(--dim);
    font-size: 0.8rem;
    margin-top: 4px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    max-width: 800px;
    margin: 0 auto 32px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }
  .stat-card .label {
    font-size: 0.65rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .stat-card .value {
    font-size: 1.4rem;
    font-weight: 700;
  }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.gold { color: var(--gold); }
  .stat-card .value.accent { color: var(--accent); }

  .chart-container {
    max-width: 800px;
    margin: 0 auto 32px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .chart-container h3 {
    font-size: 0.7rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }
  canvas { width: 100% !important; height: 200px !important; }

  .table-wrap {
    max-width: 800px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .table-wrap h3 {
    font-size: 0.7rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 16px 16px 8px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.75rem;
  }
  th {
    text-align: left;
    padding: 8px 12px;
    color: var(--dim);
    font-weight: 500;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: rgba(124, 77, 255, 0.05); }
  .dir-up { color: var(--green); }
  .dir-down { color: var(--red); }
  .win { color: var(--green); }
  .loss { color: var(--red); }
  .paper-badge {
    font-size: 0.55rem;
    background: rgba(124, 77, 255, 0.15);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 6px;
  }
  .updated {
    text-align: center;
    color: var(--dim);
    font-size: 0.65rem;
    margin-top: 24px;
  }
  .footer {
    text-align: center;
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .footer a {
    color: var(--dim);
    text-decoration: none;
    font-size: 0.7rem;
  }
  .footer a:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <h1>🐾 <span>BTC Scalper</span> — Live Ledger</h1>
  <div class="sub">Polymarket 5-min BTC windows · Paper trading</div>
</div>

<div class="stats" id="stats"></div>

<div class="chart-container">
  <h3>Cumulative P&L ($)</h3>
  <canvas id="pnlChart"></canvas>
</div>

<div class="table-wrap">
  <h3>Recent Trades</h3>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Dir</th>
        <th>Entry</th>
        <th>Delta</th>
        <th>Strike → Settle</th>
        <th>P&L</th>
        <th>Result</th>
      </tr>
    </thead>
    <tbody id="trades"></tbody>
  </table>
</div>

<div class="updated" id="updated"></div>

<div class="footer">
  <a href="https://clawdtools.ai">clawdtools.ai</a>
</div>

<script>
async function load() {
  const resp = await fetch('ledger.json?' + Date.now());
  const data = await resp.json();
  const trades = data.trades || [];
  const stats = data.stats || {};

  // Stats cards
  const winRate = stats.total_trades > 0
    ? ((stats.wins / stats.total_trades) * 100).toFixed(1)
    : '0';
  const avgProfit = stats.total_trades > 0
    ? (stats.total_pnl / stats.total_trades).toFixed(2)
    : '0';

  document.getElementById('stats').innerHTML = `
    <div class="stat-card">
      <div class="label">Record</div>
      <div class="value green">${stats.wins}W / ${stats.losses}L</div>
    </div>
    <div class="stat-card">
      <div class="label">Win Rate</div>
      <div class="value gold">${winRate}%</div>
    </div>
    <div class="stat-card">
      <div class="label">Total P&L</div>
      <div class="value green">$${stats.total_pnl?.toFixed(2)}</div>
    </div>
    <div class="stat-card">
      <div class="label">Avg Profit</div>
      <div class="value accent">$${avgProfit}</div>
    </div>
    <div class="stat-card">
      <div class="label">Total Trades</div>
      <div class="value">${stats.total_trades}</div>
    </div>
  `;

  // Table (most recent first)
  const tbody = document.getElementById('trades');
  const sorted = [...trades].reverse();
  tbody.innerHTML = sorted.map(t => {
    const ts = new Date(t.timestamp).toLocaleString('en-GB', {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
      timeZone: 'Europe/Oslo'
    });
    const dirClass = t.direction === 'Up' ? 'dir-up' : 'dir-down';
    const arrow = t.direction === 'Up' ? '▲' : '▼';
    const resClass = t.result === 'WIN' ? 'win' : 'loss';
    const pnl = t.profit != null ? t.profit : 0;
    const paper = t.paper ? '<span class="paper-badge">PAPER</span>' : '';
    const strike = t.strike?.toFixed(0) || '—';
    const settle = t.settlement?.toFixed(0) || '—';
    return `<tr>
      <td>${ts}</td>
      <td class="${dirClass}">${arrow} ${t.direction}</td>
      <td>${t.entry_price?.toFixed(3)}</td>
      <td>${t.delta_at_entry >= 0 ? '+' : ''}${t.delta_at_entry?.toFixed(0)}</td>
      <td>$${strike} → $${settle}</td>
      <td class="${resClass}">$${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}</td>
      <td class="${resClass}">${t.result}${paper}</td>
    </tr>`;
  }).join('');

  // Chart
  let cumPnl = 0;
  const pnlData = trades.map(t => {
    cumPnl += (t.profit || 0);
    return cumPnl;
  });
  const labels = trades.map((_, i) => i + 1);

  const canvas = document.getElementById('pnlChart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 200 * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = 200;
  const pad = { t: 10, r: 10, b: 20, l: 50 };
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
  const maxY = Math.max(...pnlData, 1);

  // Grid
  ctx.strokeStyle = '#1e1e2e';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (ch / 4) * i;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#6b6b80';
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';
    ctx.fillText('$' + (maxY - (maxY / 4) * i).toFixed(0), pad.l - 6, y + 3);
  }

  // Line
  ctx.beginPath();
  ctx.strokeStyle = '#00e676';
  ctx.lineWidth = 2;
  pnlData.forEach((v, i) => {
    const x = pad.l + (i / (pnlData.length - 1 || 1)) * cw;
    const y = pad.t + ch - (v / maxY) * ch;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Fill
  const lastX = pad.l + cw;
  const lastY = pad.t + ch - (pnlData[pnlData.length - 1] / maxY) * ch;
  ctx.lineTo(lastX, pad.t + ch);
  ctx.lineTo(pad.l, pad.t + ch);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
  grad.addColorStop(0, 'rgba(0, 230, 118, 0.15)');
  grad.addColorStop(1, 'rgba(0, 230, 118, 0)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Updated
  const now = new Date().toLocaleString('en-GB', {
    timeZone: 'Europe/Oslo', dateStyle: 'medium', timeStyle: 'short'
  });
  document.getElementById('updated').textContent = `Last updated: ${now}`;
}

load();
</script>
</body>
</html>
